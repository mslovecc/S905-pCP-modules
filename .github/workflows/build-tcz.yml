name: Build N1 Kernel TCZ

on:
  workflow_dispatch:
    inputs:
      source_release:
        description: "Release tag of S905-pCP-kernels"
        required: false
        default: "v0.4.2"
      bundle_asset:
        description: "Release bundle asset"
        required: false
        default: "6.12.67.tar.gz"
      kernel_release:
        description: "Kernel release name"
        required: false
        default: "6.12.112-pcp-n1"
  push:
    branches: [main]

permissions:
  contents: read

env:
  SOURCE_REPO: mslovecc/S905-pCP-kernels
  DEFAULT_SOURCE_RELEASE: v0.4.2
  DEFAULT_BUNDLE_ASSET: 6.12.67.tar.gz
  DEFAULT_KERNEL_RELEASE: 6.12.112-pcp-n1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl ca-certificates xz-utils gzip file \
            squashfs-tools coreutils findutils

      - name: Resolve variables
        id: vars
        shell: bash
        env:
          INPUT_SOURCE_RELEASE: ${{ github.event.inputs.source_release }}
          INPUT_BUNDLE_ASSET: ${{ github.event.inputs.bundle_asset }}
          INPUT_KERNEL_RELEASE: ${{ github.event.inputs.kernel_release }}
        run: |
          set -euo pipefail
          SOURCE_RELEASE="${INPUT_SOURCE_RELEASE:-$DEFAULT_SOURCE_RELEASE}"
          BUNDLE_ASSET="${INPUT_BUNDLE_ASSET:-$DEFAULT_BUNDLE_ASSET}"
          KERNEL_RELEASE="${INPUT_KERNEL_RELEASE:-$DEFAULT_KERNEL_RELEASE}"
          EXT="N1-KERNEL-${KERNEL_RELEASE}"
          ARTIFACT_NAME="N1-KERNEL-${KERNEL_RELEASE//./-}"

          {
            echo "SOURCE_RELEASE=$SOURCE_RELEASE"
            echo "BUNDLE_ASSET=$BUNDLE_ASSET"
            echo "KERNEL_RELEASE=$KERNEL_RELEASE"
            echo "EXT=$EXT"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

          echo "SOURCE_RELEASE=$SOURCE_RELEASE"
          echo "BUNDLE_ASSET=$BUNDLE_ASSET"
          echo "KERNEL_RELEASE=$KERNEL_RELEASE"
          echo "EXT=$EXT"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME"

      - name: Download kernel release bundle
        shell: bash
        env:
          SOURCE_RELEASE: ${{ steps.vars.outputs.SOURCE_RELEASE }}
          BUNDLE_ASSET: ${{ steps.vars.outputs.BUNDLE_ASSET }}
        run: |
          set -euxo pipefail
          URL="https://github.com/${SOURCE_REPO}/releases/download/${SOURCE_RELEASE}/${BUNDLE_ASSET}"
          curl -fL --retry 5 --retry-delay 3 "$URL" -o source-release.tar.gz
          ls -lh source-release.tar.gz
          file source-release.tar.gz

      - name: Extract release bundle
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf source-release
          mkdir -p source-release
          tar -xzf source-release.tar.gz -C source-release
          find source-release -maxdepth 4 -type f -printf '%p %s bytes\n' | sort

      - name: Locate module archive
        id: locate
        shell: bash
        env:
          KERNEL_RELEASE: ${{ steps.vars.outputs.KERNEL_RELEASE }}
        run: |
          set -euo pipefail
          MODULE_ARCHIVE="$(find source-release -type f -name "modules-${KERNEL_RELEASE}.tar.gz" -print -quit)"
          if [ -z "$MODULE_ARCHIVE" ]; then
            echo "ERROR: modules archive not found for ${KERNEL_RELEASE}"
            echo "Available module archives:"
            find source-release -type f -name 'modules-*.tar.gz' -print | sort
            exit 1
          fi
          echo "MODULE_ARCHIVE=$MODULE_ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Using module archive: $MODULE_ARCHIVE"

      - name: Extract module archive
        shell: bash
        env:
          MODULE_ARCHIVE: ${{ steps.locate.outputs.MODULE_ARCHIVE }}
        run: |
          set -euxo pipefail
          rm -rf modules-tree
          mkdir -p modules-tree
          tar -xzf "$MODULE_ARCHIVE" -C modules-tree
          find modules-tree -maxdepth 3 -type d -print | sort

      - name: Normalize module tree
        shell: bash
        env:
          KERNEL_RELEASE: ${{ steps.vars.outputs.KERNEL_RELEASE }}
        run: |
          set -euo pipefail
          if [ ! -d "modules-tree/kernel" ] && [ -d "modules-tree/${KERNEL_RELEASE}/kernel" ]; then
            mv "modules-tree/${KERNEL_RELEASE}" modules-tree-normalized
            rm -rf modules-tree
            mv modules-tree-normalized modules-tree
          fi
          find modules-tree -maxdepth 2 -type d -print | sort
          test -d "modules-tree/kernel"
          test -f "modules-tree/modules.dep"
          test -f "modules-tree/modules.alias"
          echo "Module tree layout OK."

      - name: Validate module tree
        shell: bash
        run: |
          set -euo pipefail
          du -sh modules-tree
          KO_COUNT="$(find modules-tree/kernel -type f \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.xz' -o -name '*.ko.zst' \) | wc -l)"
          echo "KO_COUNT=$KO_COUNT"
          test "$KO_COUNT" -ge 100
          ls -lh modules-tree/modules.dep modules-tree/modules.alias modules-tree/modules.order modules-tree/modules.builtin modules-tree/modules.symbols

      - name: Prepare TCZ filesystem
        shell: bash
        env:
          KERNEL_RELEASE: ${{ steps.vars.outputs.KERNEL_RELEASE }}
          EXT: ${{ steps.vars.outputs.EXT }}
        run: |
          set -euxo pipefail
          DST="tcz-root/usr/local/lib/modules/${KERNEL_RELEASE}"
          rm -rf tcz-root "${EXT}.tcz" "${EXT}.tcz.md5"
          mkdir -p "$DST"
          cp -a modules-tree/kernel "$DST/"
          cp -a modules-tree/modules.* "$DST/"
          find tcz-root/usr/local/lib/modules -maxdepth 3 -type d -print | sort
          find "$DST/kernel" -type f \( -name '*.ko' -o -name '*.ko.gz' -o -name '*.ko.xz' -o -name '*.ko.zst' \) | wc -l

      - name: Build TCZ
        shell: bash
        env:
          EXT: ${{ steps.vars.outputs.EXT }}
        run: |
          set -euxo pipefail
          mksquashfs tcz-root "${EXT}.tcz" -noappend -no-xattrs -comp xz -b 131072
          ls -lh "${EXT}.tcz"
          file "${EXT}.tcz"

      - name: Validate TCZ
        shell: bash
        env:
          EXT: ${{ steps.vars.outputs.EXT }}
          KERNEL_RELEASE: ${{ steps.vars.outputs.KERNEL_RELEASE }}
        run: |
          set -euo pipefail
          unsquashfs -ll "${EXT}.tcz" > tcz-list.txt
          grep -q "usr/local/lib/modules/${KERNEL_RELEASE}/kernel/" tcz-list.txt
          grep -q "usr/local/lib/modules/${KERNEL_RELEASE}/modules.dep" tcz-list.txt
          grep -q "usr/local/lib/modules/${KERNEL_RELEASE}/modules.alias" tcz-list.txt
          echo "TCZ validation passed."

      - name: Generate checksums and manifest
        shell: bash
        env:
          EXT: ${{ steps.vars.outputs.EXT }}
          KERNEL_RELEASE: ${{ steps.vars.outputs.KERNEL_RELEASE }}
          SOURCE_RELEASE: ${{ steps.vars.outputs.SOURCE_RELEASE }}
          BUNDLE_ASSET: ${{ steps.vars.outputs.BUNDLE_ASSET }}
        run: |
          set -euo pipefail
          sha256sum "${EXT}.tcz" > "${EXT}.tcz.sha256"
          md5sum "${EXT}.tcz" > "${EXT}.tcz.md5"
          unsquashfs -ll "${EXT}.tcz" > "${EXT}.manifest.txt"

          {
            echo "Extension: ${EXT}.tcz"
            echo "Kernel release: ${KERNEL_RELEASE}"
            echo "Source repository: ${SOURCE_REPO}"
            echo "Source release: ${SOURCE_RELEASE}"
            echo "Bundle asset: ${BUNDLE_ASSET}"
            echo "Build date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > "${EXT}.build-info.txt"

          ls -lh "${EXT}.tcz" "${EXT}.tcz.sha256" "${EXT}.tcz.md5" "${EXT}.manifest.txt" "${EXT}.build-info.txt"
          cat "${EXT}.tcz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.ARTIFACT_NAME }}
          path: |
            ${{ steps.vars.outputs.EXT }}.tcz
            ${{ steps.vars.outputs.EXT }}.tcz.sha256
            ${{ steps.vars.outputs.EXT }}.tcz.md5
            ${{ steps.vars.outputs.EXT }}.manifest.txt
            ${{ steps.vars.outputs.EXT }}.build-info.txt
          if-no-files-found: error
